version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/Ssc
      - /tests/Ssc.Tests
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bratislava
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "deps(nuget)"

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bratislava
    # .NET 10 on purpose: the Steam client runs on it. Feature bands and patches only.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(sdk)"

  # Actions are pinned by commit SHA; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bratislava
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
